spring.application.name=futfy

# Conexão MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/futfy_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root

# ⚠️ Deixa vazio se usares XAMPP, ou coloca a tua senha do MySQL Workbench
spring.datasource.password=root

# Driver e Dialeto
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
